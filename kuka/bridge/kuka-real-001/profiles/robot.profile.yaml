# kuka-real-001 --- RoboPay Fabric robot profile
#
# Acceptance criteria covered: #2 (Zenoh bridge), #6 (scope classification),
# #8 (robot identity & wallet binding).
#
# Everything numeric in this file is asserted against arm_spec.py by
# tests/test_profiles.py, so the profile can never drift from the robot.
apiVersion: robopay.kuka/v1
kind: RobotProfile

profileId: kuka.kuka-real-001.mujoco-sim.v1
robotId: kuka-real-001
displayName: FabricArm-001 (MuJoCo simulated pick-and-place arm)
version: 1.0.0

vendor:
  name: Fabric community contribution
  robotModel: kuka-real-001
  hardwareRevision: "n/a (simulated)"

# --------------------------------------------------------------------- scope
# Criterion #6. Stated once, machine-readable, and repeated in README.md.
scope:
  classification: simulator          # simulator | real-hardware | hybrid
  tier: 1
  simulationOnly: true
  realWorldActuation: false
  gpuRequired: false
  networkEgressDuringExecution: false
  safetyNote: >
    This profile never drives physical hardware. Every action is executed by a
    physics engine on CPU inside the robot process. No motor command, no
    teleop channel and no hardware driver exists in this bridge.

# ---------------------------------------------------------------- embodiment
embodiment:
  type: manipulator
  degreesOfFreedom: 4
  specSource: ../arm_spec.py         # single source of truth for BOTH engines
  kinematics:
    baseHeight: 0.40                 # arm_spec.BASE_H
    link1: 0.28                      # arm_spec.LINK1
    link2: 0.24                      # arm_spec.LINK2
    maxReach: 0.52                   # arm_spec.MAX_REACH
    workRadius: 0.35                 # arm_spec.WORK_R
    units: meters
  joints:
    - {name: pan,      type: hinge, axis: z, limitRad: 3.14}
    - {name: shoulder, type: hinge, axis: y, limitRad: 1.95}
    - {name: elbow,    type: hinge, axis: y, limitRad: 2.55}
    - {name: wristp,   type: hinge, axis: y, limitRad: 2.75}
  gripper:
    type: parallel-jaw
    fingers: 2
    halfApertureClosed: 0.0322       # arm_spec.FINGER_CLOSED
    halfApertureOpen: 0.0500         # arm_spec.FINGER_OPEN
    contactGated: true               # closes only after measured normal force

# ---------------------------------------------------------------- simulation
simulation:
  primaryEngine:
    name: mujoco
    versionSpec: ">=3.1,<4"
    module: simulator.py
    headless: true
    timestep: 0.002                  # arm_spec.TIMESTEP
  secondaryEngine:                   # Tier 1 sim-to-sim requirement
    name: pybullet
    versionSpec: ">=3.2.5"
    module: simulator_pybullet.py
    headless: true
  determinism:
    controller: deterministic-trajectory
    closedFormKeyframes: true        # solved once at import, no runtime IK loop
    randomSeeds: false               # nothing stochastic in the pipeline
    replayedAnimation: false         # object motion comes from contact dynamics
  physicsEvidence:                   # what makes this a real execution, not a mock
    - gravity
    - rigid-body-collision
    - friction
    - contact-normal-force
    - free-floating-object-dynamics

# ----------------------------------------------------------------- transport
# Criterion #2. Topic names match flow/zenoh_transport.py exactly.
transport:
  protocol: zenoh
  mode: peer
  endpoint: tcp/127.0.0.1:17447      # flow/zenoh_transport.py::DEFAULT_ENDPOINT
  encoding: application/json
  correlationField: actionId
  topics:
    action: robot/tunnel/action      # tunnel -> robot
    result: robot/tunnel/result      # robot  -> tunnel
  node: flow/node.py
  fallback:
    name: loopback
    reason: >
      In-process transport used by unit tests and by platforms without zenoh
      wheels. Same envelope, same handler, no payment shortcuts.

# ------------------------------------------------------------------ identity
# Criterion #8. Nothing secret is stored in this repository.
identity:
  walletAddressEnv: FABRIC_ARM_WALLET_ADDRESS
  privateKeyEnv: FABRIC_ARM_PRIVATE_KEY
  payToAddressEnv: FABRIC_ARM_PAYTO_ADDRESS
  keyMaterialInRepo: false
  bindingRule: >
    An action is only executed when its envelope carries robotId
    `kuka-real-001`; the settlement receipt is bound to the same robotId and
    to the payTo address resolved from the environment at runtime.

# ------------------------------------------------------------- capabilities
capabilities:
  skills: [pick_object]
manifests:
  skills: skills.yaml
  functions: functions.yaml
  paymentPolicy: payment-policy.yaml
  executionMapping: execution-mapping.yaml
