name: Reachy Mini Tier 1 contract

on:
  # The live evidence job runs on trusted fork pushes (where repository
  # secrets are available) and may also be dispatched explicitly. It never
  # runs in an upstream pull_request context, which cannot receive fork secrets.
  workflow_dispatch:
  pull_request:
    paths:
      - "tunnel/**"
      - "bridge/common/**"
      - "bridge/reachy_mini/**"
      - "registry/vendors/pollen-robotics/**"
      - ".github/workflows/reachy-tier1.yml"
  push:
    branches: [hugging-face-reachy-mini-tier-1]

jobs:
  tunnel-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and test the real Go Tunnel
        run: |
          make build
          make test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install bridge contract-test dependencies
        run: python -m pip install -r bridge/reachy_mini/mujoco_sim_bridge/requirements.txt
      - name: Run Reachy fail-closed bridge contract
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/reachy_mini/mujoco_sim_bridge
        run: |
          python -m unittest \
            bridge/reachy_mini/mujoco_sim_bridge/tests/test_action_contract.py \
            bridge/reachy_mini/mujoco_sim_bridge/tests/test_bridge_safety_config.py
      - name: Prove simulator failure, timeout, replay, and restart never settle
        env:
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib
        working-directory: bridge/reachy_mini
        run: python test_x402_no_settlement.py

  sim2sim-webots:
    name: Reachy Mini Sim-to-Sim (MuJoCo + Webots)
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies and the pinned Reachy model
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libgirepository1.0-dev pkg-config wget xvfb \
            libgl1 libglu1-mesa libglib2.0-0 libgomp1 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libxtst6 libxi6 libxss1 libqt5core5a \
            libqt5gui5 libqt5widgets5 libqt5network5 libqt5svg5 \
            libqt5webengine5 libqt5webenginecore5 libqt5webenginewidgets5 \
            libqt5multimedia5 libqt5printsupport5 libqt5concurrent5 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -y libsndio7.0 2>/dev/null || sudo apt-get install -y libsndio-dev 2>/dev/null || true
          python -m pip install --upgrade pip
          python -m pip install -r bridge/reachy_mini/mujoco_sim_bridge/requirements.txt
          python -m pip install git+https://github.com/pollen-robotics/reachy_mini.git@v1.8.4
          wget -q https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2
          sudo tar xjf webots-R2025a-x86-64.tar.bz2 -C /usr/local
          rm webots-R2025a-x86-64.tar.bz2
      - name: Run the real policy in both simulators
        working-directory: bridge/reachy_mini/mujoco_sim_bridge/simulation
        env:
          WEBOTS_EXE: /usr/local/webots/webots
          WEBOTS_CONTROLLER_PATH: ${{ github.workspace }}/bridge/reachy_mini/mujoco_sim_bridge/simulation/scenes/controllers
          REACHY_SIM2SIM_BATCH: "1"
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: /usr/local/webots/lib
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python -c "
          import os, sys
          sys.path.insert(0, os.path.dirname(os.getcwd()))
          sys.path.insert(0, '.')
          from sim2sim import Sim2SimValidator
          from environment import ReachyMiniEnvironment
          from metrics import SimulationMetricsTracker
          from policy.controller import ReachyTaskPolicy
          result = Sim2SimValidator(ReachyMiniEnvironment, ReachyTaskPolicy, SimulationMetricsTracker).run_validation()
          assert result['overall_sim2sim_robustness_score'] >= 0.9, result
          assert 'Webots' in result['simulators_evaluated'], result
          print(result)
          "
      - name: Upload Sim-to-Sim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachy-sim2sim-evidence
          path: bridge/reachy_mini/mujoco_sim_bridge/simulation/webots_sim2sim_result.json
          retention-days: 90
          if-no-files-found: error

  base-sepolia-e2e:
    name: Reachy Mini Base Sepolia settlement evidence
    # Secrets are available on this fork's trusted push runs, not on the
    # upstream pull_request event that evaluates an external contribution.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build the real Tunnel
        run: make build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator dependencies and Webots
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libgirepository1.0-dev pkg-config wget xvfb \
            libgl1 libglu1-mesa libglib2.0-0 libgomp1 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libxtst6 libxi6 libxss1 libqt5core5a \
            libqt5gui5 libqt5widgets5 libqt5network5 libqt5svg5 \
            libqt5webengine5 libqt5webenginecore5 libqt5webenginewidgets5 \
            libqt5multimedia5 libqt5printsupport5 libqt5concurrent5 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -y libsndio7.0 2>/dev/null || sudo apt-get install -y libsndio-dev 2>/dev/null || true
          python -m pip install --upgrade pip
          python -m pip install -r bridge/reachy_mini/mujoco_sim_bridge/requirements.txt
          python -m pip install git+https://github.com/pollen-robotics/reachy_mini.git@v1.8.4
          wget -q https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2
          sudo tar xjf webots-R2025a-x86-64.tar.bz2 -C /usr/local
          rm webots-R2025a-x86-64.tar.bz2
      - name: Start local Zenoh router for the Tunnel and bridge
        run: |
          wget -q https://github.com/eclipse-zenoh/zenoh/releases/download/1.9.0/zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip
          unzip -q zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip -d .zenoh-router
          .zenoh-router/zenohd > zenohd.log 2>&1 &
          sleep 2
          grep -q "zenohd" zenohd.log
      - name: Run live Base Sepolia proof and generate public evidence
        working-directory: bridge/reachy_mini
        env:
          PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_PRIVATE_KEY }}
          ROBO_PAYEE_ADDRESS: ${{ secrets.ROBO_PAYEE_ADDRESS }}
          ROBOT_ID: reachy-mini-kauker
          # The paid bridge performs the same real MuJoCo + Webots validation
          # used by the profile. The production default remains 90 seconds;
          # this evidence job gives that cross-engine result time to finish.
          EXECUTION_TIMEOUT_SECONDS: "300"
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib:/usr/local/webots/lib
          PROXY_WS_URL: wss://api.fabric.foundation/api/core/ws/robot
          WEBOTS_EXE: /usr/local/webots/webots
          WEBOTS_CONTROLLER_PATH: ${{ github.workspace }}/bridge/reachy_mini/mujoco_sim_bridge/simulation/scenes/controllers
          REACHY_SIM2SIM_BATCH: "1"
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python test_base_sepolia_tunnel_e2e.py
      - name: Upload generated Base Sepolia evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachy-base-sepolia-evidence
          path: bridge/reachy_mini/base_sepolia_result_*.json
          retention-days: 90
          if-no-files-found: error
