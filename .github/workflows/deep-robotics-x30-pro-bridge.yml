name: deep-robotics-x30-pro Tier 1 bridge

on:
  workflow_dispatch:
  push:
    branches: [deep-robotics-x30-pro-tier-1]
    paths:
      - "bridge/deep-robotics/x30-pro/**"
      - ".github/workflows/deep-robotics-x30-pro-bridge.yml"
  pull_request:
    paths:
      - "bridge/deep-robotics/x30-pro/**"
      - ".github/workflows/deep-robotics-x30-pro-bridge.yml"
jobs:
  syntax:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q bridge/deep-robotics/x30-pro/mujoco_loco

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r bridge/deep-robotics/x30-pro/mujoco_loco/requirements.txt
      - run: pytest -q bridge/deep-robotics/x30-pro/mujoco_loco/tests/

  sim2sim:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r bridge/deep-robotics/x30-pro/mujoco_loco/requirements.txt
      - run: pip install pybullet==3.2.7
      - run: pytest -q bridge/deep-robotics/x30-pro/mujoco_loco/tests/test_sim2sim.py

  x402-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r bridge/deep-robotics/x30-pro/mujoco_loco/requirements.txt
      - run: pytest -q bridge/deep-robotics/x30-pro/mujoco_loco/tests/test_x402.py bridge/deep-robotics/x30-pro/mujoco_loco/tests/test_payment_gate.py

  evidence:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r bridge/deep-robotics/x30-pro/mujoco_loco/requirements.txt
      - run: python -m flow.demo --all
        working-directory: bridge/deep-robotics/x30-pro/mujoco_loco
      - run: python docs/evidence/render_evidence.py
        working-directory: bridge/deep-robotics/x30-pro/mujoco_loco
