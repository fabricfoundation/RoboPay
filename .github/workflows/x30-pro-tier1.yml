name: DeepRobotics X30 Pro Tier 1 contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tunnel/**"
      - "bridge/common/**"
      - "bridge/deep_robotics/x30_pro_mujoco_bridge/**"
      - "registry/vendors/deep-robotics/**"
      - ".github/workflows/x30-pro-tier1.yml"
  push:
    branches: [deep-robotics-x30-pro-tier-1]
    paths:
      - "tunnel/**"
      - "bridge/common/**"
      - "bridge/deep_robotics/x30_pro_mujoco_bridge/**"
      - "registry/vendors/deep-robotics/**"
      - ".github/workflows/x30-pro-tier1.yml"

jobs:
  tunnel-and-contract:
    name: Real Tunnel/x402/Zenoh authorization contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build and test the real Go Tunnel
        run: |
          make build
          make test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install X30 bridge dependencies and the locked vendor model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/deep_robotics/x30_pro_mujoco_bridge/requirements.txt
          python bridge/deep_robotics/x30_pro_mujoco_bridge/download_x30_model.py
      - name: Fail-closed and payment-bound integration checks
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/deep_robotics/x30_pro_mujoco_bridge
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib
        run: |
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_contract.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_registry_contract.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_bridge_contract.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_payment_gate.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_e2e_paid_action.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_x402_no_settlement.py

  x30-mujoco:
    name: X30 vendor-MJCF MuJoCo state-feedback proof
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies and the pinned vendor model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/deep_robotics/x30_pro_mujoco_bridge/requirements.txt
          python bridge/deep_robotics/x30_pro_mujoco_bridge/download_x30_model.py
      - name: Run actual X30 MuJoCo inspection lane
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/deep_robotics/x30_pro_mujoco_bridge
        run: |
          python bridge/deep_robotics/x30_pro_mujoco_bridge/tests/test_mujoco_runtime.py
          python bridge/deep_robotics/x30_pro_mujoco_bridge/run_inspection_lane.py --json-output bridge/deep_robotics/x30_pro_mujoco_bridge/artifacts/mujoco_result.json
      - name: Upload MuJoCo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x30-pro-mujoco-evidence
          path: bridge/deep_robotics/x30_pro_mujoco_bridge/artifacts/mujoco_result.json
          retention-days: 90
          if-no-files-found: error

  x30-sim2sim:
    name: X30 Sim-to-Sim (MuJoCo + Webots)
    runs-on: ubuntu-latest
    needs: tunnel-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Webots and X30 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb libgl1 libglu1-mesa libglib2.0-0 libgomp1 libfontconfig1 libxkbcommon0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxtst6 libxi6 libxss1 libqt5core5a libqt5gui5 libqt5widgets5 libqt5network5 libqt5svg5 libqt5webengine5 libqt5webenginecore5 libqt5webenginewidgets5 libqt5multimedia5 libqt5printsupport5 libqt5concurrent5 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          sudo apt-get install -y libsndio7.0 2>/dev/null || sudo apt-get install -y libsndio-dev 2>/dev/null || true
          python -m pip install --upgrade pip
          python -m pip install -r bridge/deep_robotics/x30_pro_mujoco_bridge/requirements.txt
          python bridge/deep_robotics/x30_pro_mujoco_bridge/download_x30_model.py
          wget -q https://github.com/cyberbotics/webots/releases/download/R2025a/webots-R2025a-x86-64.tar.bz2
          sudo tar xjf webots-R2025a-x86-64.tar.bz2 -C /usr/local
      - name: Run same bounded policy in both real simulators
        env:
          PYTHONPATH: ${{ github.workspace }}/bridge/deep_robotics/x30_pro_mujoco_bridge
          WEBOTS_EXE: /usr/local/webots/webots
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python bridge/deep_robotics/x30_pro_mujoco_bridge/run_sim2sim_validation.py
      - name: Upload Sim-to-Sim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x30-pro-sim2sim-evidence
          path: bridge/deep_robotics/x30_pro_mujoco_bridge/artifacts/
          retention-days: 90
          if-no-files-found: error

  x30-base-sepolia-e2e:
    name: X30 Base Sepolia settlement evidence
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: x30-pro-base-sepolia-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [tunnel-and-contract, x30-mujoco, x30-sim2sim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies, vendor model, and real Tunnel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/deep_robotics/x30_pro_mujoco_bridge/requirements.txt
          python bridge/deep_robotics/x30_pro_mujoco_bridge/download_x30_model.py
          make build
      - name: Start local Zenoh router
        run: |
          wget -q https://github.com/eclipse-zenoh/zenoh/releases/download/1.9.0/zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip
          unzip -q zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip -d .zenoh-router
          .zenoh-router/zenohd > zenohd.log 2>&1 &
          sleep 2
          grep -q "zenohd" zenohd.log
      - name: Run live Base Sepolia proof and generate evidence
        env:
          PRIVATE_KEY: ${{ secrets.BASE_SEPOLIA_PRIVATE_KEY }}
          ROBO_PAYEE_ADDRESS: ${{ secrets.ROBO_PAYEE_ADDRESS }}
          TUNNEL_BIN: ${{ github.workspace }}/bin/tunnel
          LD_LIBRARY_PATH: ${{ github.workspace }}/.zenoh-c/lib
          PROXY_WS_URL: wss://api.fabric.foundation/api/core/ws/robot
        run: python bridge/deep_robotics/x30_pro_mujoco_bridge/test_base_sepolia_tunnel_e2e.py
      - name: Upload generated Base Sepolia evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x30-pro-base-sepolia-evidence
          path: bridge/deep_robotics/x30_pro_mujoco_bridge/artifacts/base_sepolia_result_*.json
          retention-days: 90
          if-no-files-found: error
