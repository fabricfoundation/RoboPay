# unitree-g1 pick-and-carry skills
schemaVersion: robot-skills.v1

profileId: laok.unitree-g1-arm-001.pick-and-carry.v1

skills:
  - skillId: pick_and_carry
    displayName: Pick and carry an object
    description: >
      Walk forward to a pickup zone, acquire a carried object (modelled as
      co-located with the torso on this planar biped), then carry it to a
      drop zone. Success when the torso reaches the drop zone within the
      step budget after passing the pickup zone; otherwise a genuine physics
      timeout (no fabricated success).
    pricing:
      amount: "0.10"
      amountAtomic: 100000
      currency: USDC
      network: eip155:84532
      settlement: on-success-only
    paramsSchema:
      type: object
      properties:
        pickupDistance:
          type: number
          description: Pickup zone X in metres (object acquired when torso passes it)
          minimum: 0.1
          maximum: 6.0
          default: 1.0
        dropDistance:
          type: number
          description: Drop zone X in metres (goal the torso must reach)
          minimum: 0.2
          maximum: 8.0
          default: 2.0
        speed:
          type: number
          minimum: 0.0
          maximum: 1.5
          default: 0.6
      additionalProperties: false
    failureModes:
      - reason: timeout
        description: >
          Step budget exhausted before the drop zone was reached. This is a
          real physics outcome, never a scripted success.

  - skillId: move_forward
    displayName: Walk forward
    description: >
      Advance the unitree-g1 planar biped forward by a goal distance using a
      deterministic stepping gait. Success when the torso reaches the goal
      within the step budget; otherwise a genuine physics timeout (no fabricated
      success).
    pricing:
      amount: "0.10"
      amountAtomic: 100000
      currency: USDC
      network: eip155:84532
      settlement: on-success-only
    paramsSchema:
      type: object
      properties:
        goalDistance:
          type: number
          description: Target forward distance in metres
          minimum: 0.1
          maximum: 8.0
          default: 1.0
        speed:
          type: number
          minimum: 0.0
          maximum: 1.5
          default: 0.6
      additionalProperties: false
    failureModes:
      - reason: timeout
        description: >
          Step budget exhausted before the goal distance was reached. This is a
          real physics outcome (the gait simply did not cover enough ground in
          time), never a scripted success.

  - skillId: navigate_obstacle
    displayName: Navigate to a goal over a curb
    description: >
      Walk forward and step over a low curb (0.04 m half-height) to reach a goal
      X using the same gait. The swing foot lifts 0.12 m, well clear of the curb,
      so the traversal is genuine geometry, not a teleport.
    pricing:
      amount: "0.10"
      amountAtomic: 100000
      currency: USDC
      network: eip155:84532
      settlement: on-success-only
    paramsSchema:
      type: object
      properties:
        goal_x:
          type: number
          description: Target X coordinate in metres
          default: 2.0
        speed:
          type: number
          minimum: 0.0
          maximum: 1.5
          default: 0.6
      additionalProperties: false
    failureModes:
      - reason: timeout
        description: Step budget exhausted before reaching the goal X.

  - skillId: stop
    displayName: Safe stop
    description: >
      Hold the current pose; no forward motion. Always succeeds when paid, and
      proves the bounded / interruptible policy (the run terminates cleanly and
      never settles a failed action).
    pricing:
      amount: "0.10"
      amountAtomic: 100000
      currency: USDC
      network: eip155:84532
      settlement: on-success-only
    paramsSchema:
      type: object
      properties: {}
      additionalProperties: false
    failureModes: []
