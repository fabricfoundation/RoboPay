# unitree-g1 --- RoboPay Tier 1 bridge (Simulator Skill Execution)
#
# Planar biped walker for Unitree G1 (5-DOF, MuJoCo / PyBullet simulated).
#
# Acceptance criteria covered: #2 (Zenoh bridge), #6 (scope classification),
# #8 (robot identity & wallet binding).
#
# Everything numeric in this file is asserted against g1_spec.py by
# tests/test_profiles.py, so the profile can never drift from the robot.
apiVersion: robopay.fabric/v1
kind: RobotProfile

profileId: laok.unitree-g1-arm-001.pick-and-carry.v1
robotId: unitree-g1
displayName: Unitree G1 (planar biped, pick-and-carry, MuJoCo/PyBullet simulated)
version: 1.0.0

vendor:
  name: Unitree Robotics
  robotModel: g1
  hardwareRevision: "n/a (simulated)"

# --------------------------------------------------------------------- scope
# Criterion #6. Stated once, machine-readable, and repeated in README.md.
scope:
  classification: simulator          # simulator | real-hardware | hybrid
  tier: 1
  simulationOnly: true
  realWorldActuation: false
  gpuRequired: false
  networkEgressDuringExecution: false
  safetyNote: >
    This profile never drives physical hardware. Every action is executed by a
    physics engine on CPU inside the robot process. No motor command, no
    teleop channel and no hardware driver exists in this bridge.

# ---------------------------------------------------------------- embodiment
embodiment:
  type: planar_biped
  degreesOfFreedom: 5
  specSource: ../g1_spec.py         # single source of truth for BOTH engines
  kinematics:
    torsoHeight: 0.55               # g1_spec.TORSO_H
    thighLength: 0.31               # g1_spec.THIGH_LEN
    shankLength: 0.31               # g1_spec.SHANK_LEN
    footHeight: 0.03                # g1_spec.FOOT_H
    hipHeight: 0.65                 # g1_spec.HIP_Z = THIGH + SHANK + FOOT_H
    standingHeight: 0.925           # g1_spec.STAND_Z = HIP_Z + TORSO_H/2
    units: meters
  joints:
    - {name: torso_x,   type: slide,  axis: x, limited: false}
    - {name: left_hip,  type: hinge,  axis: y, limitRad: -1.3, maxRad: 1.3}
    - {name: left_knee, type: hinge,  axis: y, limitRad: 0.0,  maxRad: 2.4}
    - {name: right_hip, type: hinge,  axis: y, limitRad: -1.3, maxRad: 1.3}
    - {name: right_knee,type: hinge,  axis: y, limitRad: 0.0,  maxRad: 2.4}
  simplification: >
    Planar model: the torso slides in X only (its Z is pinned at the standing
    height by a prismatic joint, so it cannot pitch or sink), the two 2-link
    legs are kinematically driven to their IK targets and do not exchange
    physical contact forces with the ground (foot/leg collision group is masked
    away from the floor), and the torso X is integrated by the solver under real
    gravity. The gait timing, swing-foot lift, curb-traversal geometry and the
    travelled distance are therefore genuine physics; only the ground-reaction
    load is abstracted away. This is documented honestly in simulator.py.

# ---------------------------------------------------------------- simulation
simulation:
  primaryEngine:
    name: mujoco
    versionSpec: ">=3.1,<4"
    module: simulator.py
    headless: true
    timestep: 0.004                  # g1_spec.TIMESTEP
  secondaryEngine:                   # Tier 1 sim-to-sim requirement
    name: pybullet
    versionSpec: ">=3.2.5"
    module: simulator_pybullet.py
    headless: true
  determinism:
    controller: open-loop-gait       # 2-link IK + deterministic stepping gait
    policyDriven: true               # NOT a replayed animation
    randomSeeds: false
    replayedAnimation: false
  physicsEvidence:                   # what makes this a real execution, not a mock
    - gravity
    - torso-x-integration
    - swing-foot-lift
    - curb-geometry

# ----------------------------------------------------------------- transport
# Criterion #2. Topic names match flow/zenoh_transport.py exactly.
transport:
  protocol: zenoh
  mode: peer
  endpoint: tcp/127.0.0.1:17447      # flow/zenoh_transport.py::DEFAULT_ENDPOINT
  encoding: application/json
  correlationField: actionId
  topics:
    action: robot/tunnel/action      # tunnel -> robot
    result: robot/tunnel/result      # robot  -> tunnel
  node: flow/node.py
  fallback:
    name: loopback
    reason: >
      In-process transport used by unit tests and by platforms without zenoh
      wheels. Same envelope, same handler, no payment shortcuts.

# ------------------------------------------------------------------ identity
# Criterion #8. Nothing secret is stored in this repository.
identity:
  walletAddressEnv: UNITREE_G1_WALLET_ADDRESS
  privateKeyEnv: UNITREE_G1_PRIVATE_KEY
  payToAddressEnv: UNITREE_G1_PAYTO_ADDRESS
  keyMaterialInRepo: false
  bindingRule: >
    An action is only executed when its envelope carries robotId
    `unitree-g1`; the settlement receipt is bound to the same robotId and
    to the payTo address resolved from the environment at runtime.

# ------------------------------------------------------------- capabilities
capabilities:
  skills: [pick_and_carry, move_forward, navigate_obstacle, stop]
manifests:
  skills: skills.yaml
  functions: functions.yaml
  paymentPolicy: payment-policy.yaml
  execution-mapping: execution-mapping.yaml
