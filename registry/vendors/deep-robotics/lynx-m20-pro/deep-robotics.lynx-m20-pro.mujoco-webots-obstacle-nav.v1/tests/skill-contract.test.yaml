profileId: deep-robotics.lynx-m20-pro.mujoco-webots-obstacle-nav.v1
tests:
  - name: dynamic_obstacle_navigation_contract
    runner: bridge/deep_robotics/m20_pro_mujoco_bridge/tests/test_contract.py
    action: navigate_obstacle_course
    expect: {accepted: true}
  - name: unknown_action_rejected_before_simulation
    runner: bridge/deep_robotics/m20_pro_mujoco_bridge/tests/test_contract.py
    action: sprint_through_wall
    expect: {accepted: false, actionEvents: 0}
  - name: safe_stop_is_parameterless
    runner: bridge/deep_robotics/m20_pro_mujoco_bridge/tests/test_contract.py
    action: stop
    expect: {accepted: true}
  - name: real_mujoco_obstacle_yield
    runner: bridge/deep_robotics/m20_pro_mujoco_bridge/tests/test_mujoco_runtime.py
    action: navigate_obstacle_course
    expect: {success: true, simulator: MuJoCo, stateAuthority: base_link, obstacleYield: true}
  - name: sim_to_sim
    runner: bridge/deep_robotics/m20_pro_mujoco_bridge/run_sim2sim_validation.py
    action: navigate_obstacle_course
    expect: {success: true, simulators: [MuJoCo, Webots]}
