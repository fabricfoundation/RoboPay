schemaVersion: execution-mapping.v1
profileId: booster.k1.obstacle-nav-sim.v1

transport:
  type: zenoh
  actionTopic: robot/tunnel/action
  resultTopic: robot/tunnel/result
  actionSchema: robopay-action.v1
  resultSchema: robot-action-result.v1

# Payment verification happens entirely in the Go tunnel
# (tunnel/internal/handlers: X402VerifyOnly gate + ExecutionWatcher
# settlement) BEFORE an event is ever published to actionTopic. The
# published event therefore carries no payment fields -- this bridge
# trusts every event it receives already passed that fail-closed gate.
envelope:
  requiredFields:
    - actionId
    - action
    - params
  correlationField: actionId
  note: >-
    actionId is generated by the tunnel at accept-time (POST /action
    returns 202 {actionId, ...}); the same actionId is expected back
    on resultTopic so the tunnel's ExecutionWatcher can settle the
    correct payment record.

mappings:
  k1_navigate_avoid_obstacles:
    output: mujoco_dwa_navigation
    simulator: mujoco
    scene: simulation/mujoco/scenes/booster_k1_obstacle_nav.xml
    runner: simulation/mujoco/runner.py
    completion:
      runningEvidence:
        - policy loop step count > 0
        - actuator control values change over time
      successEvidence:
        - distance_to_goal <= 0.3m
        - collision_count == 0
      failure:
        modes:
          - timeout_exceeded
          - collision_detected
          - goal_unreachable
        action: stop_actuators
        retryAutomatically: false

replayProtection:
  bridgeLevel:
    storage: sqlite
    key: actionId
    note: >-
      Prevents this bridge from dispatching the same actionId to the
      simulator twice within one bridge process's lifetime.
  tunnelLevel:
    storage: file-backed (tunnel/internal/handlers/idempotency.go)
    uniqueFields:
      - actionId
    durable: true
    note: >-
      The authoritative replay guard. Reserves actionId before
      publishing to actionTopic and survives a tunnel process restart,
      so a retried/replayed HTTP request can never be dispatched
      twice even across a crash.
