# limx-tron2 functions
schemaVersion: agent-functions.v1

functions:
  - name: list_robot_skills
    description: List available skills for this robot
    method: GET
    url: /v1/robots/{robotId}/skills
    paid: false

  - name: request_robot_action
    description: Request a robot action (unpaid - returns 402)
    method: POST
    url: /v1/robots/{robotId}/actions
    body:
      skillId: string
      params: object
      idempotencyKey: string
    paid: false
    paymentUnpaidStatus: 402
    paymentRequiredHeader: payment-required

  - name: submit_paid_robot_action
    description: Submit a paid robot action with x402 payment proof
    method: POST
    url: /v1/robots/{robotId}/actions
    headers:
      X-PAYMENT: string
    body:
      skillId: string
      params: object
      idempotencyKey: string
    paid: true
