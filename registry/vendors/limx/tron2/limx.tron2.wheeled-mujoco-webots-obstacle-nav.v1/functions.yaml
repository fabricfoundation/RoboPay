schemaVersion: agent-functions.v1
profileId: limx.tron2.wheeled-mujoco-webots-obstacle-nav.v1
functions:
  - name: get_robot_profile
    method: GET
    url: /robot
    returns:
      "200": robot_id and skills_url
  - name: list_robot_skills
    method: GET
    url: /skills
    returns:
      "200": registered skill IDs, enabled state and USDC price
  - name: request_robot_action
    method: POST
    url: /action
    body:
      action: string
      robot_id: string
      action_id: string
      idempotency_key: string
      params: object
    payment:
      unpaidStatus: 402
      paymentRequiredHeader: PAYMENT-REQUIRED
  - name: submit_paid_robot_action
    method: POST
    url: /action
    headers:
      PAYMENT-SIGNATURE: string
    body: same as request_robot_action
    returns:
      "202": accepted/pending with action_id and status_url
      "400": invalid action parameters; no actuation
      "402": payment required or verification rejected
      "403": skill not allowed or wrong robot
      "409": replay detected
      "429": rate limited
      "503": allowlist, idempotency store or result channel unavailable
    settlement: >-
      Verification occurs before the action boundary. Settlement is deferred
      until the exact correlated TRON 2 result reports success; failure,
      timeout, mismatch and replay remain unsettled.
  - name: get_robot_action_status
    method: GET
    url: /action/{action_id}/status
