    The relay settles only on results with status "success". Every error
    result (DUPLICATE, UNKNOWN_SKILL, INVALID_PARAMS, WRONG_ROBOT,
    REJECTED_PAYMENT, UNPAID, ACTION_FAILED) must not settle.
