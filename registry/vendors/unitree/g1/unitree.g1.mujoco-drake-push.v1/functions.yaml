schemaVersion: agent-functions.v1
profileId: unitree.g1.mujoco-drake-push.v1

functions:
  - name: list_robot_skills
    description: >-
      Discover what the robot can do and what it charges, before paying for
      anything. The bridge also publishes this on the Zenoh topic
      robot/g1/skills at startup.
    method: GET
    url: /v1/robots/{robotId}/skills
    response:
      robotId: string
      skills:
        - name: string
          description: string
          priceUSDC: string
          paymentRequired: boolean
          paramsSchema: object

  - name: request_robot_action
    description: >-
      Request an action without payment. Returns 402 with the payment
      requirements; the robot does not move.
    method: POST
    url: /v1/robots/{robotId}/actions
    body:
      skillId: string
      params: object
      idempotencyKey: string
    payment:
      unpaidStatus: 402
      paymentRequiredHeader: payment-required

  - name: submit_paid_robot_action
    description: >-
      Submit the action with an x402 authorisation. The tunnel verifies the
      payment and attaches txHash before the envelope reaches the robot.
    method: POST
    url: /v1/robots/{robotId}/actions
    headers:
      X-PAYMENT: string
    body:
      skillId: string
      params: object
      idempotencyKey: string
      # Hash of the params the payer authorised. The robot recomputes it and
      # refuses the action if it does not match, so parameters altered in
      # flight never reach the simulator.
      paramsHash: string
      expiresAt: string
    response:
      status: string          # "success" | "error"
      skill: string
      actionId: string
      settle: boolean         # false for every failure, replay included
      result: object
      error: object
      metrics: object

  - name: get_action_result
    description: >-
      Terminal result for an action, correlated by actionId. Also published on
      the Zenoh topic robot/tunnel/result.
    method: GET
    url: /v1/robots/{robotId}/actions/{actionId}

errors:
  - code: PAYMENT_REQUIRED
    meaning: no verified payment on the envelope; robot did not move
  - code: PARAMS_HASH_MISMATCH
    meaning: params differ from what the payer signed for
  - code: PARAMS_OUT_OF_RANGE
    meaning: target outside the reachable workspace
  - code: ACTION_EXPIRED
    meaning: envelope past its expiresAt
  - code: IDEMPOTENCY_REPLAY
    meaning: key already executed; not re-run and not settled
  - code: UNKNOWN_ROBOT
    meaning: envelope addressed to a different robotId
  - code: UNKNOWN_SKILL
    meaning: skillId not in the catalogue
  - code: ACTION_FAILED
    meaning: the robot attempted the action and did not complete it
