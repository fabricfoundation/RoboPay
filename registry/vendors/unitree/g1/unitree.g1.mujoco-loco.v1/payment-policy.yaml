# unitree-g1 payment policy
schemaVersion: payment-policy.v1

provider:
  scheme: exact
  protocol: x402
  network: eip155:84532          # Base Sepolia
  chainId: 84532
  asset:
    address: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"   # Base Sepolia USDC (Circle-verified)
    symbol: USDC
    decimals: 6
  amount: "0.10"
  currency: USDC
  version: "1"
  payToAddressEnv: UNITREE_G1_PAYTO_ADDRESS

challenge:
  resource: "robopay://unitree-g1-arm-001/{skill}"
  description: "Pay-to-actuate unitree-g1 locomotion skill"
  maxTimeoutSeconds: 300
  headerIn: "X-PAYMENT"

lifecycle:
  - phase: request
    status: 402
    description: Payment required before execution
  - phase: verify
    status: 200
    description: Payment verified, action accepted
  - phase: execute
    status: 200
    description: Action executed successfully
  - phase: settle
    status: 200
    description: Payment settled after successful execution

safety:
  settleOnFailure: false
  failClosed: true
  idempotencyKeyRequired: true
  replayProtection: true

secrets:
  privateKeyEnv: UNITREE_G1_PRIVATE_KEY
  walletAddressEnv: UNITREE_G1_WALLET_ADDRESS
  payToAddressEnv: UNITREE_G1_PAYTO_ADDRESS
  neverCommitToRepo: true
