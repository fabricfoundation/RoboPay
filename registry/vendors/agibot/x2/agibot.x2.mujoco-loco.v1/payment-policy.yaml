# agibot-x2 payment policy
schemaVersion: payment-policy.v1

provider:
  scheme: exact
  protocol: x402
  network: eip155:84532
  chainId: 84532
  asset:
    address: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
    symbol: USDC
    decimals: 6
  amount: "0.10"
  currency: USDC
  version: "1"
  payToAddressEnv: AGIBOT_X2_PAYTO_ADDRESS

challenge:
  resource: "robopay://agibot-x2/{skill}"
  description: "Pay-to-actuate agibot-x2 locomotion skill"
  maxTimeoutSeconds: 300
  headerIn: "X-PAYMENT"

lifecycle:
  - phase: request
    status: 402
    description: Payment required before execution
  - phase: verify
    status: 200
    description: Payment verified, action accepted
  - phase: execute
    status: 200
    description: Action executed successfully
  - phase: settle
    status: 200
    description: Payment settled after successful execution

safety:
  settleOnFailure: false
  failClosed: true
  idempotencyKeyRequired: true
  replayProtection: true

secrets:
  privateKeyEnv: AGIBOT_X2_PRIVATE_KEY
  walletAddressEnv: AGIBOT_X2_WALLET_ADDRESS
  payToAddressEnv: AGIBOT_X2_PAYTO_ADDRESS
  neverCommitToRepo: true
