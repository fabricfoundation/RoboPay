schemaVersion: robot-skills.v1
profileId: agibot.x2-ultra.mujoco-webots-active-inspection.v1
skills:
  - skillId: inspect_target_sequence
    description: >-
      Use the X2 waist, head, and arm joints to confirm one to three inspection
      targets in a disclosed pelvis safety fixture with both feet on the floor.
      Progression is driven by measured joint error and dwell time, not by a
      prerecorded animation.
    params:
      maxDurationSec:
        type: number
        min: 5
        max: 30
        default: 18
      targets:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          enum: [left, center, right]
        default: [left, center, right]
      speedScale:
        type: number
        min: 0.5
        max: 1.0
        default: 1.0
    paymentRequired: true
    priceUSDC: "0.001"
    movementLimits:
      maxDurationSec: 30
      maxTargets: 3
      headYawRad: [-0.488692, 0.488692]
      headPitchRad: [-0.523599, 0.523599]
      targetErrorToleranceRad: 0.075
      targetDwellSec: 0.55
      webotsMaxMotorVelocityRadSec: 2.2
  - skillId: stop
    description: >-
      Interrupt inspection, command the neutral 31-motor pose, and zero joint
      velocity. The interrupted inspection reports failure and cannot settle.
    params: {}
    paymentRequired: true
    priceUSDC: "0.001"
