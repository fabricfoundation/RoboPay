schemaVersion: agent-functions.v1
profileId: agibot.x2-ultra.mujoco-webots-active-inspection.v1
functions:
  - name: get_robot_profile
    method: GET
    url: /robot
    returns: {"200": robot_id and skills_url}
  - name: list_robot_skills
    method: GET
    url: /skills
    returns: {"200": registered skill IDs, enabled state, and USDC price}
  - name: request_robot_action
    method: POST
    url: /action
    body:
      action: string
      robot_id: string
      params: object
      action_id: string
      idempotency_key: string
    payment:
      unpaidStatus: 402
      paymentRequiredHeader: PAYMENT-REQUIRED
  - name: submit_paid_robot_action
    method: POST
    url: /action
    headers: {PAYMENT-SIGNATURE: string}
    body: same as request_robot_action
    returns:
      "202": accepted pending a correlated execution result
      "400": invalid parameters; zero simulator actuation
      "402": payment missing, nil verification, or isValid false
      "403": wrong robot or disallowed skill
      "409": replay detected
      "503": execution-result channel unavailable
    settlement: >-
      Verification must succeed before PostAction. Settlement occurs only after
      a correlated X2 success result; failure, timeout, replay, and interrupted
      inspection make zero facilitator settlement calls.
  - name: get_robot_action_status
    method: GET
    url: /action/{action_id}/status
