schemaVersion: payment-policy.v1
profileId: agibot.x2.tier1-mujoco-webots.v1
provider: x402
network: eip155:84532
asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
assetSymbol: USDC
assetDecimals: 6
amountUnit: smallest
payeeEnv: ROBOPAY_PAYEE_ADDRESS

policies:
  - skillId: x2_obstacle_avoid_nav
    required: true
    amount: "2000"
    displayPriceUSDC: "0.002"
    paymentHeader: PAYMENT-SIGNATURE
    requiredBridgeEvidence:
      - provider
      - authorizationId
      - verified
      - status
      - settled
      - network
      - asset
      - amount
      - payTo
      - issuedAt
      - expiresAt

settlement:
  settleOnResultStatus: success
  requireSettlementEligible: true
  pendingStates:
    - accepted
    - pending
  rule: >-
    The relay may settle only after a correlated robot/tunnel/result message
    has status=success and settlementEligible=true, produced only after both
    MuJoCo and Webots independently report task completion (Sim-to-Sim
    validation). A result derived from only one simulator, a timeout, a
    collision-failure, or a running/in-progress state must never settle.

authorizationWindow:
  defaultMaxTtlSec: 300
  defaultFutureClockSkewSec: 30
  maxConfigurableTtlSec: 3600
  maxConfigurableFutureClockSkewSec: 300
