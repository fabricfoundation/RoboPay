claimBoundary:
  scope: simulator-only Tier 1
  claimed: >-
    The shared Tunnel validates x402 evidence before publishing an ActionEvent;
    the Atlas DRC/v4 MuJoCo bridge executes a measured-state wave and publishes
    a correlated terminal result; settlement is deferred until that exact
    result is successful.
  notClaimed: >-
    This profile does not represent the current electric Atlas and does not
    claim physical Atlas execution. It uses public DARPA-era hydraulic Atlas
    DRC/v4 assets in two independent simulators. It does not claim joint-level
    compatibility or policy transfer to the 56-DoF electric Atlas.

