schemaVersion: agent-functions.v1
profileId: boston-dynamics.atlas-drc.mujoco-webots-wave.v1
functions:
  - name: get_robot_profile
    method: GET
    url: /robot
  - name: list_robot_skills
    method: GET
    url: /skills
  - name: request_robot_action
    method: POST
    url: /action
    body:
      action: string
      robot_id: string
      action_id: string
      idempotency_key: string
      params: object
    payment:
      unpaidStatus: 402
      paymentRequiredHeader: PAYMENT-REQUIRED
  - name: submit_paid_robot_action
    method: POST
    url: /action
    headers:
      PAYMENT-SIGNATURE: string
    body: same as request_robot_action
    returns:
      "202": accepted/pending; terminal result is correlated by action_id
      "400": invalid action parameters; no simulator actuation
      "402": payment required or invalid payment evidence
      "403": skill not allowed or wrong robot
      "409": replay detected
      "429": rate limited
      "503": allowlist, replay store, or result channel unavailable
    settlement: >-
      Verification is fail-closed before action publication. Settlement occurs
      only after a matching Atlas simulator result reports status success.
  - name: get_action_status
    method: GET
    url: /action/{actionId}/status
    resultCorrelation: [action_id, robot_id, skill_id, params_hash, idempotency_key]
