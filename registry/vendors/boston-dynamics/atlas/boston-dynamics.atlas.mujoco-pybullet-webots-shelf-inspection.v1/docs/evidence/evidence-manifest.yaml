settlement:
  paid_action:
    note: >-
      The settlement for the demonstrated action. The authorization nonce is
      keccak256(action_id), so this transfer is verifiably the one that paid for
      this action rather than any other; the same value appears in the token's
      AuthorizationUsed event.
    action_id: "act-paid-de66513f791b"
    network: Base Sepolia (eip155:84532)
    asset: USDC 0x036CbD53842c5426634e7929541eC2318f3dCF7e
    transaction: "0x2b3b71d0ce18554a4927e1145a704359bad35c209f632dc414926b995aac0f39"
    explorer: https://sepolia.basescan.org/tx/0x2b3b71d0ce18554a4927e1145a704359bad35c209f632dc414926b995aac0f39
    block: 45706216
    transferred: 0.001 USDC
    payer: "0xa0597a74f3C3F33797007495bc3Dc676F10Fc2Dc"
    payee: "0x7b9163254A21b249a0D3E34300fC81BB0A43C3e8"
    authorization_nonce: "0xaa6cf89a24e6ee6471a1dde2a1e9eee101d60213f9231132ea717affd03b47de"
    submitted_by: "0xd407e409E34E0b9afb99EcCeb609bDbcD5e7f1bf"
    submitted_by_note: >-
      The x402 facilitator's own address, as advertised by its /supported
      endpoint. The facilitator submitted the transaction and paid the gas,
      which is what EIP-3009 is for and why the payer needs no ETH. It is also
      independent evidence that this settlement went through the live
      facilitator rather than being self-submitted.
  fabric_relay_action:
    note: >-
      The settlement for the action that ran through the hosted Fabric relay.
      Its nonce is keccak256(action_id) too, so it is bound to that action and
      not to any other. The tunnel answered 202 immediately and settled from a
      background watcher, only after the correlated result reported every target
      reached.
    action_id: "atlas-inspect-1787197727"
    transaction: "0xfd9eda75ddc6c6f979eb2571e6e85ef3a6f50d670f3f8ad252107723e21e6940"
    explorer: https://sepolia.basescan.org/tx/0xfd9eda75ddc6c6f979eb2571e6e85ef3a6f50d670f3f8ad252107723e21e6940
    block: 45714728
    transferred: 0.001 USDC
    payer: "0xa0597a74f3C3F33797007495bc3Dc676F10Fc2Dc"
    payee: "0x7b9163254A21b249a0D3E34300fC81BB0A43C3e8"
    authorization_nonce: "0x38f39e2c3e8e663fb9ce14bbbd4ae1825a17d68972ee17fc5f802df06a61169d"
    submitted_by: "0xd407e409E34E0b9afb99EcCeb609bDbcD5e7f1bf"
  recorded_action:
    note: >-
      The settlement shown in atlas-paid-action.gif. It was located on chain by
      its nonce rather than by its hash — keccak256(action_id) is enough to find
      the AuthorizationUsed event, which is the binding working in the direction
      a reviewer would use it.
    action_id: "atlas-inspect-1787200740"
    transaction: "0xea4353bf089b08c1758bba6a27e4faa45503c0536a2a8b921d9e7de94486abb8"
    explorer: https://sepolia.basescan.org/tx/0xea4353bf089b08c1758bba6a27e4faa45503c0536a2a8b921d9e7de94486abb8
    block: 45716247
    transferred: 0.001 USDC
    authorization_nonce: "0x24bfe0a79140d5b24e4b8df20a648e3c1bba3ad5db42e30b5ae6b2de50a44ae5"
  refused_action_not_settled:
    note: >-
      The failing counterpart of the run above, through the same relay with the
      same wallet. The tunnel accepted the request with 202, the bridge refused
      the action, and nothing
      settled. The proof is the token's own record rather than the absence of a
      hash on our side: authorizationState(payer, keccak256(action_id)) is
      false, so USDC itself says this action was never paid for.
    action_id: "atlas-inspect-1787197752"
    execution: "refused — INVALID_DURATION"
    tunnel_response: 202 (accepted; the outcome arrives on the status endpoint)
    transaction: null
    authorization_spent_on_chain: false
  note: >-
    Testnet only, no monetary value. Both payer wallets are disposable test
    wallets and are treated as compromised; no key material is stored in this
    repository.
reproduce:
  - pip install -r bridge/boston_dynamics/atlas_bridge/requirements.txt
  - python -m bridge.boston_dynamics.atlas_bridge.download_atlas_model
  - python -m bridge.boston_dynamics.atlas_bridge.runner
  - python -m bridge.boston_dynamics.atlas_bridge.pybullet_runner
  - python -m bridge.boston_dynamics.atlas_bridge.sim2sim
  - python -m bridge.boston_dynamics.atlas_bridge.demo_e2e
  - python -m bridge.boston_dynamics.atlas_bridge.demo_tunnel
  - python -m bridge.boston_dynamics.atlas_bridge.demo_go_tunnel --tunnel <built tunnel>
  - python -m bridge.boston_dynamics.atlas_bridge.settlement_evidence
  - SETTLEMENT_PRIVATE_KEY=... python -m bridge.boston_dynamics.atlas_bridge.real_paid_run --payer <funded wallet>
  - SETTLEMENT_PRIVATE_KEY=... python -m bridge.boston_dynamics.atlas_bridge.demo_fabric_e2e --tunnel <built tunnel>
  - SETTLEMENT_PRIVATE_KEY=... python -m bridge.boston_dynamics.atlas_bridge.evidence_recording --tunnel <built tunnel>
