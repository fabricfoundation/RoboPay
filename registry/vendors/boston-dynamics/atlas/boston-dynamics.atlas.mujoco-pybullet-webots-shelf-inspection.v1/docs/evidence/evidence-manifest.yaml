settlement:
  paid_action:
    note: >-
      The settlement for the demonstrated action. The authorization nonce is
      keccak256(action_id), so this transfer is verifiably the one that paid for
      this action rather than any other; the same value appears in the token's
      AuthorizationUsed event.
    action_id: "act-paid-de66513f791b"
    network: Base Sepolia (eip155:84532)
    asset: USDC 0x036CbD53842c5426634e7929541eC2318f3dCF7e
    transaction: "0x2b3b71d0ce18554a4927e1145a704359bad35c209f632dc414926b995aac0f39"
    explorer: https://sepolia.basescan.org/tx/0x2b3b71d0ce18554a4927e1145a704359bad35c209f632dc414926b995aac0f39
    block: 45706216
    transferred: 0.001 USDC
    payer: "0xa0597a74f3C3F33797007495bc3Dc676F10Fc2Dc"
    payee: "0x7b9163254A21b249a0D3E34300fC81BB0A43C3e8"
    authorization_nonce: "0xaa6cf89a24e6ee6471a1dde2a1e9eee101d60213f9231132ea717affd03b47de"
    submitted_by: "0xd407e409E34E0b9afb99EcCeb609bDbcD5e7f1bf"
    submitted_by_note: >-
      The x402 facilitator's own address, as advertised by its /supported
      endpoint. The facilitator submitted the transaction and paid the gas,
      which is what EIP-3009 is for and why the payer needs no ETH. It is also
      independent evidence that this settlement went through the live
      facilitator rather than being self-submitted.
  fabric_relay_action:
    note: >-
      The settlement for the action that ran through the hosted Fabric relay.
      Its nonce is keccak256(action_id) too, so it is bound to that action and
      not to any other. Settled by the tunnel's own middleware after the episode
      reported every target reached.
    action_id: "atlas-inspect-1787193393"
    transaction: "0x2eca1865602dc880224ab762be20f93ba0b0c81e4bd26654445bca9d3868cd63"
    explorer: https://sepolia.basescan.org/tx/0x2eca1865602dc880224ab762be20f93ba0b0c81e4bd26654445bca9d3868cd63
    block: 45712565
    transferred: 0.001 USDC
    payer: "0xa0597a74f3C3F33797007495bc3Dc676F10Fc2Dc"
    payee: "0x7b9163254A21b249a0D3E34300fC81BB0A43C3e8"
    authorization_nonce: "0xcce2635b234375a62d581574a79815e21c1db2753766cf6f777263f692545e82"
    submitted_by: "0xd407e409E34E0b9afb99EcCeb609bDbcD5e7f1bf"
  refused_action_not_settled:
    note: >-
      The failing counterpart of the run above, through the same relay with the
      same wallet. The bridge refused it, the tunnel answered 502, and nothing
      settled. The proof is the token's own record rather than the absence of a
      hash on our side: authorizationState(payer, keccak256(action_id)) is
      false, so USDC itself says this action was never paid for.
    action_id: "atlas-inspect-1787193428"
    execution: "refused — INVALID_DURATION"
    tunnel_response: 502
    transaction: null
    authorization_spent_on_chain: false
  earlier_transfer:
    note: >-
      An earlier 1.0 USDC transfer between two test wallets, kept because the
      profile's first settlement evidence referred to it. It is not bound to any
      action_id and proves only that the asset and network are real.
    transaction: "0x5b04259e0d9cfe319a6ffec3d7f6b9118b70e09ae4a832625bed5ecd48326b6e"
    explorer: https://sepolia.basescan.org/tx/0x5b04259e0d9cfe319a6ffec3d7f6b9118b70e09ae4a832625bed5ecd48326b6e
    transferred: 1.0 USDC
    payer: "0x520C3Ff276456A217c0dFadABeEb2d7081d6cCd4"
  note: >-
    Testnet only, no monetary value. Both payer wallets are disposable test
    wallets and are treated as compromised; no key material is stored in this
    repository.
