schemaVersion: robot-skills.v1
profileId: boston-dynamics.spot.mujoco-webots-obstacle-course.v1
skills:
  - skillId: navigate_obstacle_course
    description: >-
      Drive Spot through the simulator obstacle course using closed-loop pose
      feedback and a diagonal gait. Succeeds only when it reaches the goal
      without an obstacle contact.
    params:
      maxDurationSec:
        type: number
        min: 5
        max: 60
        default: 48
      side:
        type: string
        enum: [left]
        default: left
      speedScale:
        type: number
        min: 0.25
        max: 1.0
        default: 1.0
    paymentRequired: true
    priceUSDC: "0.001"
    movementLimits:
      maxDurationSec: 60
      maxGaitFrequencyHz: 1.0
      maxHipStrokeRad: 0.10
      maxKneeLiftRad: 0.20
      maxSteeringRad: 0.30
  - skillId: stop
    description: >-
      Interrupt an active MuJoCo episode, command the neutral 12-actuator pose,
      and zero simulated velocity. If navigation is active it receives a
      correlated safe_stopped failure so that action cannot settle.
    params: {}
    paymentRequired: true
    priceUSDC: "0.001"
